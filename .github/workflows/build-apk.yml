
name: Build Zajel Chat APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q "ZajilChat-Native-Android-Source.zip" -d project

      - name: Find Gradle project and build APK
        run: |
          WRAPPER=$(find project -type f -name gradlew | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found in ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          chmod +x "$WRAPPER"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZajelChat-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
